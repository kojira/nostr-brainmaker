name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify model artifacts in Pages build
        run: |
          for file in \
            dist/models/1char/manifest.json \
            dist/models/1char/config.json \
            dist/models/1char/label_map.json \
            dist/models/1char/special_tokens_map.json \
            dist/models/1char/tokenizer.json \
            dist/models/1char/tokenizer_config.json \
            dist/models/1char/onnx/config.json \
            dist/models/1char/onnx/model_quantized.onnx
          do
            test -f "$file"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
