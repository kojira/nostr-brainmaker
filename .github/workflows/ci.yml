name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify Node runtime
        run: node -e "if (process.version !== 'v22.23.4') throw new Error(process.version)"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify model artifacts
        run: |
          for file in manifest.json config.json label_map.json special_tokens_map.json tokenizer.json tokenizer_config.json onnx/config.json onnx/model_quantized.onnx; do
            test -f "dist/models/1char/$file"
          done
